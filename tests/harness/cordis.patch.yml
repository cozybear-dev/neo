# Harness-only overlay for `dsh --profile sdk`. Inserts the Neo plugins and
# restates the sandbox rows that exist on dsh-base. The web profile's
# webserver, web, and Exa rows are not on this profile.
#
# Neo plugin package.json files have a name and no version. The official
# DeepSeek inventory refuses that identity and aborts the request before HTTP.
# This run uses the native adapter only as a scripted Messages client.

- id: plugin-package-inventory-deepseek
  config:
    enabled: false

- insert:
    - id: neo-tools-scope
      name: neo-tools-scope
    - id: neo-tools-memory
      name: neo-tools-memory
    - id: neo-tools-issues
      name: neo-tools-issues
    - id: neo-tools-oast
      name: neo-tools-oast
    - id: neo-sandbox-docker
      name: neo-sandbox-docker
    - id: neo-tools-browser
      name: neo-tools-browser
    - id: neo-tools-traffic
      name: neo-tools-traffic
    - id: neo-tools-deploy
      name: neo-tools-deploy
    - id: neo-summarizer
      name: neo-summarizer
    - id: neo-orchestrator
      name: neo-orchestrator

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'danger-full-access'
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: !!js >-
      (process.env.DSH_PERMISSION_MODE ?? 'danger-full-access') ===
      'danger-full-access' ? 'never' : 'ask'

- id: permission
  config:
    defaultPreset: !!js process.env.DSH_PERMISSION_MODE ?? 'danger-full-access'
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
