# Optional GhidraMCP profile. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ghidra.yml --profile ghidra up -d ghidra
# Or, if included from the main compose file:
#   docker compose --profile ghidra up -d ghidra
#
# GhidraMCP is an unsupported optional profile until its build and API are verified.
# Its API remains on ghidra-isolated only; import files through the dedicated volume.

services:
  ghidra:
    profiles: ["ghidra"]
    build:
      context: ./docker/ghidra
      dockerfile: Dockerfile
    environment:
      GHIDRA_MCP_PORT: "8080"
    # MCP port is isolated from the control plane and is not published to the host.
    expose:
      - "8080"
    volumes:
      - ghidra-input:/workspace
      - ghidra-projects:/home/ghidra/projects
    networks:
      - ghidra-isolated

volumes:
  ghidra-input:
  ghidra-projects:

networks:
  ghidra-isolated:
    internal: true
