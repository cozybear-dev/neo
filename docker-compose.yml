include:
  - path: docker-compose.ghidra.yml

services:
  dsh:
    build:
      context: .
      dockerfile: docker/dsh/Dockerfile
    environment:
      DSH_HOME: /home/node/.dsh
      DSH_WEB_SEARCH_PROVIDER: exa
      NEO_LLM_PROVIDER: ${NEO_LLM_PROVIDER:-deepseek}
      NEO_LLM_MODEL: ${NEO_LLM_MODEL:-deepseek-v4-flash}
      NEO_LLM_API_KEY: ${NEO_LLM_API_KEY:-}
      NEO_LLM_BASE_URL: ${NEO_LLM_BASE_URL:-}
      NEO_LLM_API: ${NEO_LLM_API:-}
      NEO_LLM_API_KEY_ENV: ${NEO_LLM_API_KEY_ENV:-}
      NEO_LLM_REASONING_EFFORT: ${NEO_LLM_REASONING_EFFORT:-}
      NEO_LLM_ORCHESTRATOR_PROVIDER: ${NEO_LLM_ORCHESTRATOR_PROVIDER:-}
      NEO_LLM_ORCHESTRATOR_MODEL: ${NEO_LLM_ORCHESTRATOR_MODEL:-}
      NEO_LLM_ORCHESTRATOR_API_KEY: ${NEO_LLM_ORCHESTRATOR_API_KEY:-}
      NEO_LLM_ORCHESTRATOR_BASE_URL: ${NEO_LLM_ORCHESTRATOR_BASE_URL:-}
      NEO_LLM_ORCHESTRATOR_API: ${NEO_LLM_ORCHESTRATOR_API:-}
      NEO_LLM_ORCHESTRATOR_API_KEY_ENV: ${NEO_LLM_ORCHESTRATOR_API_KEY_ENV:-}
      NEO_LLM_ORCHESTRATOR_REASONING_EFFORT: ${NEO_LLM_ORCHESTRATOR_REASONING_EFFORT:-}
      NEO_LLM_WORKHORSE_PROVIDER: ${NEO_LLM_WORKHORSE_PROVIDER:-}
      NEO_LLM_WORKHORSE_MODEL: ${NEO_LLM_WORKHORSE_MODEL:-}
      NEO_LLM_WORKHORSE_API_KEY: ${NEO_LLM_WORKHORSE_API_KEY:-}
      NEO_LLM_WORKHORSE_BASE_URL: ${NEO_LLM_WORKHORSE_BASE_URL:-}
      NEO_LLM_WORKHORSE_API: ${NEO_LLM_WORKHORSE_API:-}
      NEO_LLM_WORKHORSE_API_KEY_ENV: ${NEO_LLM_WORKHORSE_API_KEY_ENV:-}
      NEO_LLM_WORKHORSE_REASONING_EFFORT: ${NEO_LLM_WORKHORSE_REASONING_EFFORT:-}
      NEO_LLM_OAUTH_CHATGPT_FILE: ${NEO_LLM_OAUTH_CHATGPT_FILE:-}
      NEO_LLM_OAUTH_CLAUDE_FILE: ${NEO_LLM_OAUTH_CLAUDE_FILE:-}
      NEO_LLM_OAUTH_GROK_FILE: ${NEO_LLM_OAUTH_GROK_FILE:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PDCP_API_KEY: ${PDCP_API_KEY:-}
      HACKERONE_API_TOKEN: ${HACKERONE_API_TOKEN:-}
      CONTROL_URL: ${CONTROL_URL:-http://control:8090}
      NEO_TASK_ID: ${NEO_TASK_ID:-}
      INTERACTSH_URL: ${INTERACTSH_URL:-http://interactsh:80}
      INTERACTSH_TOKEN: ${INTERACTSH_TOKEN:?set independent OAST token}
      INTERACTSH_CALLBACK_DOMAIN: ${INTERACTSH_CALLBACK_DOMAIN:-oast.neo.internal}
      INTERACTSH_CALLBACK_BASE_URL: http://broker:8091/oast/callback
      INTERACTSH_CALLBACK_SCHEME: http
      INTERACTSH_CALLBACK_PORT: "80"
      INTERACTSH_DNS_ENABLED: "false"
      SANDBOX_CONTAINER: ${SANDBOX_CONTAINER:-neo-sandbox-1}
      BROWSER_CDP_URL: ${BROWSER_CDP_URL:-http://browser:9222}
      NEO_BROKER_URL: http://broker:8091
      NEO_TASK_TOKEN: ${NEO_TASK_TOKEN:-}
      NEO_EXEC_NETWORK: ${NEO_EXEC_NETWORK:-none}
      # Isolation is the sandbox container. DSH same-world workspace-write
      # fail-closes here (no bwrap/Landlock/ACL runner in this image).
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-danger-full-access}
    volumes:
      - dsh-home:/home/node/.dsh
      - workspace:/workspace
      # Optional subscription CLI credentials (read-only). Uncomment the matching
      # mount after the host directory exists — Compose creates a missing bind
      # source as an empty directory.
      # - ${HOME}/.codex:/host-auth/codex:ro
      # - ${HOME}/.claude:/host-auth/claude:ro
      # - ${HOME}/.grok:/host-auth/grok:ro

    ports:
      - "127.0.0.1:3080:3080"
    networks:
      - control
      - browser-link
    depends_on:
      control:
        condition: service_healthy
      broker:
        condition: service_healthy
      browser:
        condition: service_healthy

  sandbox:
    image: neo-sandbox:local
    build:
      context: ./docker/sandbox
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  broker:
    build:
      context: .
      dockerfile: docker/broker/Dockerfile
    environment:
      CONTROL_URL: http://control:8090
      NEO_CONTROL_BROKER_TOKEN: ${NEO_CONTROL_BROKER_TOKEN:?set independent broker credential}
      NEO_WORKER_IMAGE: neo-sandbox:local
      INTERACTSH_CALLBACK_DOMAIN: ${INTERACTSH_CALLBACK_DOMAIN:-oast.neo.internal}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - broker-state:/state
    networks: [control, targets]
    depends_on:
      sandbox:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8091/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  browser:
    build:
      context: ./docker/browser
    # CDP is internal browser-link only and is never published to the host.
    expose:
      - "9222"
    # Playwright image may lack curl; probe CDP with node fetch instead.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9222/json/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - browser-link

  interactsh:
    image: projectdiscovery/interactsh-server@sha256:246d8988fed0cfefb28f904c4e1ec4a6bb4b6931288d10794a31577687f02471
    # 1.3+ fatals without -domain ("No domains specified"). A dummy suffix is
    # enough for in-network HTTP OAST; a real DNS domain is only needed for
    # internet-facing OOB.
    command:
      - -domain
      - ${INTERACTSH_CALLBACK_DOMAIN:-oast.neo.internal}
      - -auth
      - -token
      - ${INTERACTSH_TOKEN:?set independent OAST token}
      - -skip-acme
      - -disable-update-check
      - -listen-ip
      - "0.0.0.0"
    restart: unless-stopped
    networks:
      - control
      - targets

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: ${NEO_DB_PASSWORD:?set database password}
      POSTGRES_DB: neo
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo -d neo"]
      interval: 5s
      timeout: 5s
      retries: 10

  control:
    build:
      context: .
      dockerfile: docker/control/Dockerfile
    environment:
      DATABASE_URL: postgres://neo:${NEO_DB_PASSWORD:?set database password}@postgres:5432/neo
      NEO_CONTROL_ADMIN_TOKEN: ${NEO_CONTROL_ADMIN_TOKEN:?set operator credential}
      NEO_CONTROL_BROKER_TOKEN: ${NEO_CONTROL_BROKER_TOKEN:?set broker credential}
      NEO_ALLOWLIST: ${NEO_ALLOWLIST:-localhost,127.0.0.1,*.lab.internal,juice-shop}
      PORT: "8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - control
    depends_on:
      postgres:
        condition: service_healthy

  juice-shop:
    image: bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e
    profiles: [lab]
    labels:
      neo.task: ${NEO_TASK_ID:-unassigned}
      neo.lab: "1"
    networks:
      - targets

volumes:
  workspace:
  pgdata:
  dsh-home:
  broker-state:
    name: neo_broker_state

networks:
  browser-link:
    internal: true
  control:
    driver: bridge
  targets:
    name: neo_targets
    driver: bridge
    internal: true
